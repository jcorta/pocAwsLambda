# Entorno local (SPEC §10). Base: `docker compose up -d floci`
# Opcional: `--profile ui` (Floci UI, con la bandeja de emails de SES).
name: reservas

services:
  floci:
    image: floci/floci:2.1.0 # versión validada en el spike F0; actualizarla implica volver a correrlo
    ports:
      - "4566:4566"
      - "7001-7010:7001-7010" # proxy de RDS, para conectarse desde el host
    environment:
      # Configuración obligatoria (hallazgo A1 del spike F0)
      FLOCI_SERVICES_DOCKER_NETWORK: floci-net
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: floci
      FLOCI_SECURITY_ALLOW_PRIVATE_JWT_TARGETS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - floci-net

  floci-ui:
    image: floci/floci-ui:0.5.0
    profiles: ["ui"]
    ports:
      - "4500:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - floci
    networks:
      - floci-net

  # Terraform en contenedor. Misma versión que .terraform-version.
  terraform:
    image: hashicorp/terraform:1.16.4
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./:/work
      - terraform-plugins:/plugin-cache
    environment:
      TF_VAR_floci_endpoint: http://floci:4566
      # Cache de providers compartida entre los roots y los módulos que se inicializan (`pnpm test:infra`)
      TF_PLUGIN_CACHE_DIR: /plugin-cache
    networks:
      - floci-net

  # Linter de Terraform (SPEC §8.1), solo con el ruleset de Terraform que trae incluido: `pnpm lint:infra`
  tflint:
    image: ghcr.io/terraform-linters/tflint:v0.64.0
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./:/work
    network_mode: none

volumes:
  terraform-plugins:

networks:
  floci-net:
    name: floci-net
