# CI de cada PR y de main (SPEC §9.1): changes, lint, unit, integration y e2e-local.
# El job infra-test (terraform test) se agrega en F6.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Desactiva la ejecución de los hooks de git en CI (prepare los instala igual, sin efecto)
  LEFTHOOK: "0"
  # Next.js no envía telemetría desde la CI
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Detecta si el cambio toca algo más que documentación. Los jobs pesados (integración, build, E2E)
  # usan `needs.changes.outputs.code` para saltearse sin quedar pendientes (SPEC §9.1).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Detectar cambios fuera de la documentación
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Push nuevo sin commit anterior conocido: se asume que hay cambios de código
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Archivos modificados:"; echo "$changed"
          code=$(echo "$changed" | grep -vE '^docs/|\.md$' | grep -q . && echo true || echo false)
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks revisa los commits del PR

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # Segunda pasada, ya con pnpm disponible, para activar la cache del store de pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

      - name: Formato de Terraform
        run: docker compose run --rm -T --no-deps terraform fmt -check -recursive -diff

      - name: Secretos en los commits (gitleaks)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          if echo "$RANGE" | grep -q '^0\{40\}\.\.'; then
            node scripts/gitleaks.mjs --all
          else
            node scripts/gitleaks.mjs --range "$RANGE"
          fi

  # Tests contra Postgres 16 real con Testcontainers (Docker viene en el runner)
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # E2E de punta a punta contra Floci: el mismo `pnpm local:up` que en una máquina de desarrollo.
  # Compila por su cuenta en lugar de descargar artifacts (decisión de F3; los artifacts llegan en F6).
  e2e-local:
    needs: [changes, lint, unit, integration]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Levantar el entorno local (Floci, Terraform, migraciones y seed)
        run: pnpm local:up
      - name: E2E de la API
        run: pnpm test:e2e

      - name: Logs de Floci y de las Lambdas (si falló)
        if: failure()
        run: |
          pnpm local:logs || true
          for fn in me resources bookings admin migrator; do echo "::group::$fn"; pnpm local:logs "$fn" || true; echo "::endgroup::"; done

      - name: Bajar el entorno
        if: always()
        run: pnpm local:reset

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Bundles de las Lambdas: se generan y se verifica que carguen (SPEC §6.5)
      - run: pnpm build
      - run: pnpm --filter @reservas/api check:bundles
